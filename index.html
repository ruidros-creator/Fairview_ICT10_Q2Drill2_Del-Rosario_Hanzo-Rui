<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Operators - Club Members</title>
    
    <!-- Bootstrap CSS for structure -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- PyScript CSS and JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Link to external custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>ADD NEW CLUB MEMBER:</h2>
        
        <!-- Input fields for First and Last Name -->
        <input type="text" id="fname" class="form-control" placeholder="First Name">
        <input type="text" id="lname" class="form-control" placeholder="Last Name">
        
        <!-- Button with PyScript event trigger -->
        <button id="submit-btn" class="btn btn-custom" py-click="add_member">Submit</button>

        <!-- Output display area -->
        <div id="output"></div>
    </div>

    <!-- Link to external Python logic -->
    <script type="py" src="main.py"></script>

</body>
</html>
